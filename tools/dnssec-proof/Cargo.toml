[package]
name = "universe-dnssec-proof"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "universe-dnssec-query"
path = "src/main.rs"

[dependencies]
dnssec-prover = "=0.6.10"
serde_json = "1.0"
base64 = "0.22"
bitcoin-payment-instructions = { version = "=0.7.1", default-features = false }
bitcoin = { version = "0.32", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dnssec-prover = { version = "=0.6.10", features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
