[package]
name = "universe-zcash-scanner"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
zcash_keys = { version = "=0.14.0", default-features = false, features = ["std", "sapling", "orchard"] }
zcash_primitives = { version = "=0.28.0", default-features = false, features = ["std"] }
zcash_protocol = { version = "=0.9.0", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "=0.7.0", default-features = false, features = ["std"] }
orchard = { version = "=0.14.0", default-features = false, features = ["std"] }
zcash_note_encryption = "=0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
jubjub = "0.10"
ff = "0.13"
zip32 = "0.2"
getrandom = { version = "0.2", features = ["custom"] }
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
