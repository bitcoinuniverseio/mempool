[package]
name = "universe-simplicity-proof-checker"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
simplicityhl = "=0.2.0"
simplicity-sys = { version = "=0.5.0", features = ["test-utils"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
[profile.release]
opt-level = "s"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
