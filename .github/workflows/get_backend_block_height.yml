name: 'Check if servers are in sync'

on: [workflow_dispatch]

jobs:
  print-backend-sha:
    runs-on: ${{ contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && fromJSON('["self-hosted","universe-runners-1"]') || 'ubuntu-24.04' }}
    name: Get block height
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: repo

      - name: Run script
        working-directory: repo
        run: |
          chmod +x ./scripts/get_block_tip_height.sh
          sh ./scripts/get_block_tip_height.sh
