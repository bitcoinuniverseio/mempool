name: 'Print images digest'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image Version'
        required: false
        default: 'latest'
        type: string 
jobs:
  route:
    uses: bitcoinuniverseio/.github-private/.github/workflows/route.yml@develop
    secrets: inherit
    with:
      plan: '{"print_images_sha":"light"}'

  print-images-sha:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.targets).print_images_sha }}
    name: Print digest for images
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: digest

      - name: Run script
        working-directory: digest
        run: |
          sh ./docker/scripts/get_image_digest.sh $VERSION
        env: 
          VERSION: ${{ github.event.inputs.version }}
