name: Universe production smoke

# Checks the live origin with nothing mocked.
#
# The rest of the suite answers every request from fixtures, which is what let
# a release ship with a Charts page and a Mining dashboard in front of routes
# that answered 404. Fixtures prove how a page renders given data; only this
# proves the deployment can produce any.

on:
  # After a release, and on a schedule so a dependency that fails later is
  # noticed without anyone deploying.
  workflow_dispatch:
    inputs:
      origin:
        description: Origin to check
        required: false
        default: https://explorer.bitcoinuniverse.io
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: universe-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Live origin answers with real content
    runs-on: [self-hosted, linux-ultra]
    # Ten was for a job that only read the API. It now installs the browser
    # harness and loads two pages in a real browser, which is the only way to
    # see what the origin renders.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'

      - name: Every advertised feature has routes, data, and a matching release
        run: node scripts/universe/synthetic-check.mjs "${{ github.event.inputs.origin || 'https://explorer.bitcoinuniverse.io' }}"

      # The step above reads the API. It cannot see what the origin renders, and
      # for as long as it could not, production served a chain dashboard whose
      # status line ran six facts together behind a raw snapshot identifier,
      # never said why Dogecoin was degraded, and published "Release
      # development" to the public, while every check here passed. The API was
      # answering correctly the whole time; the origin was serving an older
      # build than anything measured it.
      # These run whatever the step above concluded. They answer a different
      # question: that one asks whether the authorities behind the pages can
      # answer, this one asks whether the pages tell the truth about it. A
      # chain in an index recovery makes the first fail honestly, and on its
      # first run that is exactly what happened: index-doge-tap could publish
      # no checkpoint, the job stopped there, and the gate that exists to catch
      # an obsolete dashboard on the origin was skipped. A red check must not
      # blind the check after it. The job still fails if either fails.
      - name: Install the visual QA harness
        if: ${{ !cancelled() }}
        working-directory: scripts/universe/visual-qa
        run: npm ci

      - name: The gate can still tell a bad page from a good one
        if: ${{ !cancelled() }}
        working-directory: scripts/universe/visual-qa
        run: node --test chain-page-audit.test.mjs

      - name: The public chain pages say what the chain documents say
        if: ${{ !cancelled() }}
        working-directory: scripts/universe/visual-qa
        run: >-
          node chain-page-smoke.mjs
          --origin="${{ github.event.inputs.origin || 'https://explorer.bitcoinuniverse.io' }}"

      # The address family, opened in a browser against the live origin. The
      # step above covers the chain pages and this covers the one page that
      # was publicly broken while every check in this repository was green:
      # nothing here had ever asked this origin for an address.
      - name: The address page gate can still tell a bad page from a good one
        if: ${{ !cancelled() }}
        working-directory: scripts/universe/visual-qa
        run: node --test address-page-audit.test.mjs

      - name: A real address page loads with real data and no false diagnosis
        if: ${{ !cancelled() }}
        working-directory: scripts/universe/visual-qa
        run: >-
          node address-page-smoke.mjs
          --origin="${{ github.event.inputs.origin || 'https://explorer.bitcoinuniverse.io' }}"

      - name: Keep what the address pages looked like
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Diagnostic only. The gate that decides this job has already run and
        # failed it if it was going to, so an artifact store that will not take
        # a screenshot cannot turn a green gate red, and cannot hide a red one
        # either. It happened: the account hit its Actions storage quota and
        # every browser job began reporting failure with "No mobile failures"
        # printed directly above the error. The release artifact upload is
        # deliberately not marked this way, because there the upload is the
        # product rather than a report about it.
        continue-on-error: true
        with:
          name: universe-address-page-smoke
          path: scripts/universe/visual-qa/artifacts-address-smoke
          retention-days: 30

      - name: Keep what the chain pages looked like
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Diagnostic only: an artifact store that will not take a screenshot
        # must not turn a green gate red. See the note in the first such step.
        continue-on-error: true
        with:
          name: universe-chain-page-smoke
          path: scripts/universe/visual-qa/artifacts-chain-smoke
          retention-days: 30
