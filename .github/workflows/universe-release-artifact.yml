name: Universe release artifact

# Builds the one artifact a release installs, on the runner fleet.
#
# It exists because the artifact used to be built on a workstation, and that
# machine has two ways of handing you a stale build without saying so: a
# leftover server process keeps serving an old output directory, and a failed
# build step can leave the previous output in place. Both have already produced
# a measurement that described a build nobody was running. A runner starts from
# a clean checkout every time, so the artifact matches the commit it names.

# It builds the ref it is dispatched on, and takes no ref input. An input
# would be more convenient and is not safe: dispatched from the default
# branch, the job holds that branch's Actions cache scope, so building an
# arbitrary ref would run that ref's install and build scripts with write
# access to the cache every other workflow here restores from. Dispatch it
# against the branch or tag you want built instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    name: Build and pack
    runs-on: [self-hosted, linux, x64, universe, gcp, universe-gcp-release]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record what is being built
        id: sha
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'Building %s (%s)\n' "$sha" "$(git log -1 --format=%s)"
          test "$(git status --porcelain)" = ''

      - name: Prepare pinned Node environment
        uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912 # v1

      - name: Verify pinned runtime
        run: |
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 11.17.0

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Verify bounded Bitcoin RPC behavior
        working-directory: backend
        run: |
          npm run test:build-source
          node node_modules/jest/bin/jest.js --runInBand --coverage=false \
            src/api/bitcoin/bitcoin-api.rpc-cache.test.ts \
            src/rpc-api/jsonrpc.pool.test.ts

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build:universe

      - name: Verify release controls
        run: |
          python3 --version
          bash -n scripts/universe/release.sh
          UNIVERSE_TEST_PYTHON=python3 node --test \
            scripts/universe/release-gates.test.mjs \
            scripts/universe/gateway.test.mjs \
            scripts/universe/gateway-overlay-handoff.test.mjs \
            scripts/universe/gateway-restart.test.mjs

      - name: Keep backend production dependencies only
        working-directory: backend
        run: |
          npm prune --omit=dev
          git diff --exit-code -- package.json package-lock.json

      # The same gates the CI run applies to a build, applied to the build that
      # is about to be shipped. A green CI run on the same commit does not prove
      # this output is sound, because this is a different build.
      - name: Built bundle carries no upstream marks
        run: node scripts/universe/check-branding.mjs frontend/dist

      - name: Built bundle calls no third-party origin
        run: node scripts/universe/check-origins.mjs frontend/dist

      - name: Every asset the build references is in the output
        run: node scripts/universe/check-build-assets.mjs

      - name: No em dash in what the build actually ships
        run: node scripts/universe/check-text.mjs frontend/dist

      - name: The component identity check can still fail
        run: node --test scripts/universe/release-manifest.test.mjs

      # release.sh reads the frontend from frontend/build, the backend from
      # backend/dist, and the gateway from scripts/universe. The exact
      # production dependency tree is packed too. A deployment must install
      # these tested bytes instead of rebuilding dependencies on the live host.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          sha='${{ steps.sha.outputs.sha }}'
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/backend" "$stage/frontend" "$stage/scripts"
          cp -a backend/dist "$stage/backend/dist"
          cp -a backend/node_modules "$stage/backend/node_modules"
          cp -a backend/package.json "$stage/backend/package.json"
          cp -a backend/package-lock.json "$stage/backend/package-lock.json"
          # Keep the local package inputs beside the resolved production tree.
          # They make the dependency provenance auditable and keep the
          # release self-contained if its tree ever needs offline inspection.
          cp -a backend/vendor "$stage/backend/vendor"
          cp -a backend/rust-gbt "$stage/backend/rust-gbt"
          cp -a frontend/dist/mempool/browser "$stage/frontend/build"
          cp -a scripts/universe "$stage/scripts/universe"
          # The unit files travel with the release rather than being fetched
          # from a checkout that happens to be on the right commit. Adopting
          # socket activation needed both of these on the host, and taking
          # them from a workstation is the same class of mistake as building
          # the artifact there.
          mkdir -p "$stage/production"
          cp -a production/linux "$stage/production/linux"
          chmod 0755 "$stage/scripts/universe/release.sh"
          test -f "$stage/production/linux/universe-explorer-gateway.socket"
          test -f "$stage/production/linux/universe-explorer-gateway.service.d/10-socket.conf"
          # What this release is, written down once and carried with it. The
          # frontend, the explorer backend and the gateway in this artifact are
          # one commit, and stating so is what makes an origin serving two of
          # them from different releases a detectable fault rather than an open
          # question. release.sh refuses an install whose manifest names a
          # different commit, and the cutover holds the live origin to it.
          node scripts/universe/release-manifest.mjs emit --commit='${{ steps.sha.outputs.sha }}' --out="$stage/RELEASE-MANIFEST.json"
          test -f "$stage/RELEASE-MANIFEST.json"
          test -f "$stage/backend/dist/index.js"
          test -f "$stage/backend/dist/api/bitcoin/bitcoin-api.js"
          test -f "$stage/backend/dist/rpc-api/jsonrpc.js"
          test -d "$stage/backend/node_modules/@nestjs/core"
          test -e "$stage/backend/node_modules/rust-gbt"
          test -f "$stage/backend/vendor/bitcoinuniverse-ecosystem-contracts-1.2.0.tgz"
          test -f "$stage/backend/rust-gbt/package.json"
          test -f "$stage/frontend/build/index.html"
          test -f "$stage/scripts/universe/gateway.mjs"
          out="mempool-$sha.tar.gz"
          tar -czf "$out" -C "$stage" backend frontend scripts production RELEASE-MANIFEST.json
          sha256sum "$out" | tee "$out.sha256"
          printf 'name=mempool-%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            mempool-${{ steps.sha.outputs.sha }}.tar.gz
            mempool-${{ steps.sha.outputs.sha }}.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
