name: Backend Integration Tests with MariaDB

on:
  pull_request:
    branches: [master]
    types: [opened, review_requested, synchronize]
  push:
    branches:
      - master

jobs:
  backend-integration:
    timeout-minutes: 45
    if: "(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ops') && !contains(github.head_ref, 'ops/')) || github.event_name == 'push'"
    strategy:
      matrix:
        node: ["24.13.0"]
      fail-fast: false
    runs-on: [self-hosted, linux, x64, universe-super]
    env:
      COMPOSE_PROJECT_NAME: mempool-integration-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      MEMPOOL_TEST_BASE_CONFIG_FILE: ${{ github.workspace }}/${{ matrix.node }}/integration/backend/mempool-config.test.json
      MEMPOOL_TEST_RUNTIME_CONFIG_FILE: ${{ github.workspace }}/${{ matrix.node }}/integration/backend/.mempool-config.integration.json

    name: Backend Integration Tests - node ${{ matrix.node }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: ${{ matrix.node }}/integration

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          registry-url: "https://registry.npmjs.org"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ${{ matrix.node }}/integration/backend/node_modules
          key: ${{ runner.os }}-backend-integration-node-${{ matrix.node }}-${{ hashFiles('${{ matrix.node }}/integration/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-integration-node-${{ matrix.node }}-
            ${{ runner.os }}-backend-integration-

      - name: Read rust-toolchain file from repository
        id: gettoolchain
        run: echo "::set-output name=toolchain::$(cat ./rust/gbt/rust-toolchain)"
        working-directory: ${{ matrix.node }}/integration

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ matrix.node }}/integration/rust/gbt/target/
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('${{ matrix.node }}/integration/rust/gbt/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-
            ${{ runner.os }}-cargo-

      - name: Install ${{ steps.gettoolchain.outputs.toolchain }} Rust toolchain
        uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: ${{ steps.gettoolchain.outputs.toolchain }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.node }}/integration/backend

      - name: Build backend
        run: npm run build
        working-directory: ${{ matrix.node }}/integration/backend

      - name: Verify config file exists
        run: |
          ls -la mempool-config.test.json
          echo "Current directory: ${PWD}"
          echo "Config file will be: ${{ github.workspace }}/${{ matrix.node }}/integration/backend/mempool-config.test.json"
          test -f mempool-config.test.json || (echo "ERROR: Config file not found!" && exit 1)
        working-directory: ${{ matrix.node }}/integration/backend

      - name: Run integration tests (DB auto-starts via Jest)
        run: |
          echo "MEMPOOL_CONFIG_FILE=$MEMPOOL_CONFIG_FILE"
          npm run test:integration
        working-directory: ${{ matrix.node }}/integration/backend
        env:
          MEMPOOL_CONFIG_FILE: ${{ env.MEMPOOL_TEST_RUNTIME_CONFIG_FILE }}
          SKIP_DB_TEARDOWN: '1'

      # Jest retained this job's database and wrote its assigned port into the
      # runtime config. Do not recreate it with the compose default port.
      - name: Wait for an authenticated database query
        working-directory: ${{ matrix.node }}/integration/backend
        run: |
          ready=false
          for i in {1..30}; do
            if [ "$(timeout 5s docker compose -f docker-compose.test.yml exec -T db-test mariadb -h localhost -u mempool_test -pmempool_test mempool_test --batch --skip-column-names -e 'SELECT 1' 2>/dev/null)" = 1 ]; then
              ready=true
              break
            fi
            sleep 2
          done
          [ "$ready" = true ] || { echo 'Database did not answer an authenticated query before the deadline'; exit 1; }

      - name: Start backend and verify its database capability over HTTP
        working-directory: ${{ matrix.node }}/integration/backend
        env:
          MEMPOOL_CONFIG_FILE: ${{ env.MEMPOOL_TEST_RUNTIME_CONFIG_FILE }}
        run: node ../scripts/universe/backend-startup-check.mjs

      - name: Display logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs db-test || true
        working-directory: ${{ matrix.node }}/integration/backend

      - name: Cleanup containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
        working-directory: ${{ matrix.node }}/integration/backend
