name: Backend integration diagnostic (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-integration:
    strategy:
      matrix:
        node: ["24.19.0"]
      fail-fast: false
    runs-on: [self-hosted, linux, x64, universe, gcp, universe-gcp-medium]
    env:
      COMPOSE_PROJECT_NAME: mempool-integration-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      MEMPOOL_TEST_BASE_CONFIG_FILE: ${{ github.workspace }}/${{ matrix.node }}/integration/backend/mempool-config.test.json
      MEMPOOL_TEST_RUNTIME_CONFIG_FILE: ${{ github.workspace }}/${{ matrix.node }}/integration/backend/.mempool-config.integration.json

    name: Backend Integration Tests - node ${{ matrix.node }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ${{ matrix.node }}/integration

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: "https://registry.npmjs.org"
          cache: 'npm'
          cache-dependency-path: '${{ matrix.node }}/integration/backend/package-lock.json'

      - name: Install npm 11.17.0
        run: npm install -g npm@11.17.0

      - name: Cache node modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.node }}/integration/backend/node_modules
          key: ${{ runner.os }}-backend-integration-node-${{ matrix.node }}-${{ hashFiles('${{ matrix.node }}/integration/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-integration-node-${{ matrix.node }}-
            ${{ runner.os }}-backend-integration-

      - name: Read rust-toolchain file from repository
        id: gettoolchain
        run: echo "toolchain=$(cat ./rust/gbt/rust-toolchain)" >> "$GITHUB_OUTPUT"
        working-directory: ${{ matrix.node }}/integration

      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ matrix.node }}/integration/rust/gbt/target/
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('${{ matrix.node }}/integration/rust/gbt/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-
            ${{ runner.os }}-cargo-

      - name: Install ${{ steps.gettoolchain.outputs.toolchain }} Rust toolchain
        uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: ${{ steps.gettoolchain.outputs.toolchain }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.node }}/integration/backend

      - name: Build backend
        run: npm run build
        working-directory: ${{ matrix.node }}/integration/backend

      - name: Verify config file exists
        run: |
          ls -la mempool-config.test.json
          echo "Current directory: ${PWD}"
          echo "Config file will be: ${{ github.workspace }}/${{ matrix.node }}/integration/backend/mempool-config.test.json"
          test -f mempool-config.test.json || (echo "ERROR: Config file not found!" && exit 1)
        working-directory: ${{ matrix.node }}/integration/backend

      - name: Run integration tests (DB auto-starts via Jest)
        run: |
          echo "MEMPOOL_CONFIG_FILE=$MEMPOOL_CONFIG_FILE"
          npm run test:integration
        working-directory: ${{ matrix.node }}/integration/backend
        env:
          MEMPOOL_CONFIG_FILE: ${{ env.MEMPOOL_TEST_RUNTIME_CONFIG_FILE }}
          SKIP_DB_TEARDOWN: '1'

      - name: Start backend server and verify its HTTP identity
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');
          const file = process.env.MEMPOOL_CONFIG_FILE;
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.MEMPOOL.BACKEND = 'esplora';
          config.MEMPOOL.ENABLED = false;
          config.STATISTICS.ENABLED = false;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          NODE

          node dist/index.js > backend-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          EXPECTED_SHA=$(git rev-parse --short HEAD)

          for attempt in {1..90}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat backend-server.log
              exit 1
            fi
            if BODY=$(curl -fsS --max-time 2 http://127.0.0.1:8998/api/v1/backend-info 2>/dev/null); then
              printf '%s' "$BODY" | EXPECTED_SHA="$EXPECTED_SHA" node -e '
                let raw = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => raw += chunk);
                process.stdin.on("end", () => {
                  const info = JSON.parse(raw);
                  const version = require("./package.json").version;
                  if (info.version !== version || info.gitCommit !== process.env.EXPECTED_SHA || info.backend !== "esplora" || info.lightning !== false) process.exit(1);
                });'
              echo "Backend HTTP endpoint returned the built release identity."
              exit 0
            fi
            sleep 1
          done

          cat backend-server.log
          exit 1
        working-directory: ${{ matrix.node }}/integration/backend
        env:
          MEMPOOL_CONFIG_FILE: ${{ env.MEMPOOL_TEST_RUNTIME_CONFIG_FILE }}

      - name: Cleanup containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
        working-directory: ${{ matrix.node }}/integration/backend

      - name: Display logs on failure
        if: failure()
        run: |
          echo "=== MariaDB logs ==="
          docker compose -f docker-compose.test.yml logs db-test || true
        working-directory: ${{ matrix.node }}/integration/backend

