name: Universe CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universe-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Documentation gates
    runs-on: [self-hosted, linux-ultra]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'

      - name: Protocol coverage table matches the recorded manifest
        run: node scripts/universe/generate-protocol-coverage.mjs --check

      - name: No em dash anywhere
        run: node scripts/universe/check-text.mjs

      - name: No raw interface colour outside the allowlist
        run: node scripts/universe/check-colors.mjs

      - name: Every dynamic palette carries a readable foreground
        run: node scripts/universe/check-palettes.mjs

      - name: Contrast arithmetic is correct
        run: node --test scripts/universe/contrast.test.mjs

      - name: No obsolete upstream product marks
        run: node scripts/universe/check-branding.mjs

      - name: No third-party data origins
        run: node scripts/universe/check-origins.mjs

      - name: Gateway routing
        run: node --test scripts/universe/gateway.test.mjs

  backend:
    name: Backend build and test
    runs-on: [self-hosted, linux-ultra]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install (builds rust-gbt)
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Unit tests
        working-directory: backend
        run: npm run test:ci

  frontend:
    name: Frontend build
    runs-on: [self-hosted, linux-ultra]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test:ci

      - name: Production build
        working-directory: frontend
        run: npm run build:universe

      - name: Built bundle carries no upstream marks
        run: node scripts/universe/check-branding.mjs frontend/dist

      - name: Built bundle calls no third-party origin
        run: node scripts/universe/check-origins.mjs frontend/dist

      - name: Every asset the build references is in the output
        run: node scripts/universe/check-build-assets.mjs

      - name: Install the visual QA harness
        working-directory: scripts/universe/visual-qa
        run: npm ci

      - name: Serve the built frontend
        run: |
          UNIVERSE_GATEWAY_PORT=8123           UNIVERSE_GATEWAY_ROOT=frontend/dist/mempool/browser           node scripts/universe/gateway.mjs &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8123/ && break
            sleep 1
          done

      - name: Measured contrast, accessibility, overflow, and screenshots
        working-directory: scripts/universe/visual-qa
        run: node capture.mjs --base=http://127.0.0.1:8123 --out=./artifacts

      - name: Forced colours and 200 percent zoom
        working-directory: scripts/universe/visual-qa
        run: node modes-check.mjs --base=http://127.0.0.1:8123

      - name: Keep the contrast report and the route screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: universe-visual-qa
          path: scripts/universe/visual-qa/artifacts
          retention-days: 30
