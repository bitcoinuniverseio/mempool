name: Universe CI

on:
  push:
    # develop is pushed to directly, so restricting this to main left those
    # pushes with no CI at all between one pull request and the next.
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universe-ci-${{ github.ref }}
  # A superseded commit on a pull request proves nothing about the commit that
  # replaced it, and while its run continues it holds one of the six ultra
  # runners the replacement is queued for. Pushing three times to a branch
  # under review used to mean three full matrix runs in a queue, and only the
  # last one was worth waiting for.
  #
  # Pushes to develop and main are never cancelled. Every commit on those is
  # validated on its own, because promotion reads per-commit check results and
  # the release artifact is built from main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Documentation gates
    # Any runner in the fleet. This job is a checkout, a Node install and a set
    # of Node scripts: no browser, no Rust, no Docker. Pinned to `linux-ultra`
    # it competed for the six runners that are the only ones able to run the
    # visual matrix, while eight runners carrying `universe-ci` sat idle, and a
    # three minute job held a slot the fifty minute one was queued for.
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'

      # The roster is owned by backend-apis. This holds the pinned copy to its
      # schema and its provenance, holds this repository's own surfaces to the
      # pinned roster, and refuses a roster that lost an entry. The gate it
      # replaced rendered a table from the recorded JSON and compared it with
      # the committed table, so it could only prove a file agreed with itself:
      # dunes and zrc20 were added to the registry and served in production
      # while the recorded roster here still said thirty-six, green throughout.
      - name: The pinned protocol roster holds
        run: node scripts/universe/protocol-contract.mjs --check

      - name: The protocol roster gate fires on the states it exists for
        run: node --test scripts/universe/protocol-contract.test.mjs

      # The portfolio API is described by a document backend-apis generates
      # from its own contracts, and this repository reads that API through
      # handwritten interfaces. Handwritten interfaces are where a contract
      # quietly stops being true: a field is renamed upstream, the interface
      # keeps the old name, and every read of it is undefined at runtime
      # while the compiler stays perfectly happy. This holds the two
      # together in both directions.
      - name: The pinned portfolio contract matches the interfaces that read it
        run: node scripts/universe/portfolio-contract.mjs --check

      - name: The portfolio contract gate fires on the states it exists for
        run: node --test scripts/universe/portfolio-contract.test.mjs

      - name: No em dash anywhere
        run: node scripts/universe/check-text.mjs

      - name: No raw interface colour outside the allowlist
        run: node scripts/universe/check-colors.mjs

      - name: Every dynamic palette carries a readable foreground
        run: node scripts/universe/check-palettes.mjs

      - name: Every filled surface declares the ink on it
        run: node scripts/universe/check-fills.mjs

      - name: Contrast arithmetic is correct
        run: node --test scripts/universe/contrast.test.mjs

      - name: No obsolete upstream product marks
        run: node scripts/universe/check-branding.mjs

      - name: No third-party data origins
        run: node scripts/universe/check-origins.mjs

      - name: Gateway routing
        run: node --test scripts/universe/gateway.test.mjs

      - name: The Explorer admin address redirects to the Control Center
        run: node --test scripts/universe/admin-redirect.test.mjs

      - name: The component identity check can still fail
        run: node --test scripts/universe/release-manifest.test.mjs

      - name: The gateway bridges an upstream restart rather than failing
        run: node --test scripts/universe/gateway-restart.test.mjs

      # The release gates are shell, and a shell script that has never been
      # parsed is a shell script that fails at three in the morning.
      - name: The release script parses
        run: bash -n scripts/universe/release.sh

      # `bash -n` proves the script parses, not that its gates measure
      # anything. The listener parser shipped comparing empty strings against
      # the allowlist, green the whole time. These run the script's own text
      # against healthy and unhealthy fixtures.
      - name: The release gates fail on the faults they exist for
        run: node --test scripts/universe/release-gates.test.mjs

      - name: The production synthetic check parses
        run: node --check scripts/universe/synthetic-check.mjs

  backend:
    name: Backend build and test
    runs-on: [self-hosted, linux-ultra]
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: mempool-integration-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      MEMPOOL_TEST_BASE_CONFIG_FILE: ${{ github.workspace }}/backend/mempool-config.test.json
      MEMPOOL_TEST_RUNTIME_CONFIG_FILE: ${{ github.workspace }}/backend/.mempool-config.integration.json
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` here builds rust-gbt, so it needs a Rust toolchain that can
      # actually compile. A self-hosted runner can be left holding a toolchain
      # directory with no usable rustc in it, and cargo then fails in a way
      # that reads like a source problem:
      #
      #   Type Error: Could not parse the Cargo.toml:
      #   Error: Command failed: cargo metadata --format-version 1
      #
      # There is nothing wrong with that Cargo.toml. Measured on 2026-08-31,
      # the same commit built on universe-runner-02 and universe-runner-04 and
      # failed on universe-runner-05, universe-linux-ultra-02 and
      # universe-linux-ultra-03, which is the shape that gets mistaken for
      # flakiness and retried until it lands somewhere healthy.
      #
      # Prove the toolchain compiles before anything depends on it, and
      # reinstall it in place when it does not. A healthy runner pays one
      # subsecond check; a broken one repairs itself instead of failing every
      # job routed to it. Same guard as
      # bitcoinuniverseio/index-zcash-metaprotocols.
      - name: Repair a half-installed Rust toolchain before using it
        shell: bash
        run: |
          CARGO_BIN="${CARGO_HOME:-$HOME/.cargo}/bin"
          export PATH="$CARGO_BIN:$PATH"

          if command -v rustup >/dev/null 2>&1; then
            if rustup run stable rustc --version >/dev/null 2>&1 \
               && cargo metadata --format-version 1 \
                  --manifest-path rust/gbt/Cargo.toml >/dev/null 2>&1; then
              echo "toolchain is usable"
            else
              echo "toolchain cannot read the manifest; reinstalling"
              rustup toolchain uninstall stable || true
              rustup toolchain install stable --profile minimal
              rustup default stable
            fi
          else
            echo "no rustup on this runner"
          fi

          # Put the repaired toolchain ahead of anything else for the steps
          # that follow. A step's `export PATH` dies with the step, so without
          # this the repair above fixes a cargo that `npm ci` never calls: the
          # first attempt reinstalled cleanly, reported cargo 1.98.0, and the
          # next step still failed on `cargo metadata` because it was reaching
          # a different one.
          if [ -x "$CARGO_BIN/cargo" ]; then
            echo "$CARGO_BIN" >> "$GITHUB_PATH"
          fi

          echo "cargo in use: $(command -v cargo || echo none)"
          cargo --version || true
          # Prove it can read the manifest the build depends on, here, where
          # the failure is legible, rather than inside a napi build script that
          # reports it as "Could not parse the Cargo.toml".
          cargo metadata --format-version 1 \
            --manifest-path rust/gbt/Cargo.toml >/dev/null
          echo "cargo can read rust/gbt/Cargo.toml"

      - name: Install (builds rust-gbt)
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Unit tests
        working-directory: backend
        run: npm run test:ci

      # The failure that shipped was a configuration one: the migrations never
      # ran against the engine production uses, so nothing caught the syntax it
      # rejects. These run the real backend against a real database.
      - name: Migrations and repositories against a real database
        working-directory: backend
        run: npm run test:integration
        env:
          MEMPOOL_CONFIG_FILE: ${{ env.MEMPOOL_TEST_RUNTIME_CONFIG_FILE }}

  frontend:
    name: Frontend build
    # universe-linux-ultra, not linux-ultra: only the six PowerVPS runners
    # carry the narrower label, and every job that measures pixels in a
    # browser has to run on hosts with one font stack. The broader label
    # spread to the OVH runners, whose fonts size a content-width link a half
    # pixel differently, and the same commit then passes or fails the target
    # floor depending on which machine measured it. The mobile and visual
    # jobs below are pinned for the same reason; the backend job is not,
    # because nothing it runs measures a glyph.
    runs-on: [self-hosted, universe-linux-ultra]
    # This builds, gates the bundle, and walks every route once at a phone and
    # a desktop width. The deep pass that used to follow it now runs beside it,
    # sharded, because it stopped fitting: 71 minutes of a 100 minute cap on
    # its own, and on develop it reached the cap and the required check died as
    # a timeout. Budget here is for the work that is left, with room to grow.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test:ci

      - name: Production build
        working-directory: frontend
        run: npm run build:universe

      - name: Built bundle carries no upstream marks
        run: node scripts/universe/check-branding.mjs frontend/dist

      - name: Built bundle calls no third-party origin
        run: node scripts/universe/check-origins.mjs frontend/dist

      - name: Every asset the build references is in the output
        run: node scripts/universe/check-build-assets.mjs

      - name: No em dash in what the build actually ships
        run: node scripts/universe/check-text.mjs frontend/dist

      - name: Install the visual QA harness
        working-directory: scripts/universe/visual-qa
        run: npm ci

      - name: The unfinished-page gate fires on the states that shipped
        working-directory: scripts/universe/visual-qa
        run: node --test progress-gate.test.mjs

      # The public chain page gate, checked against the states it exists for.
      # It runs against the live origin rather than this build, so nothing in
      # this job exercises it, and a gate that has only ever passed has not
      # shown it can fail. Every case it covers shipped past a green suite.
      - name: The public chain page gate fires on the states that shipped
        working-directory: scripts/universe/visual-qa
        run: node --test chain-page-audit.test.mjs

      # The address page gate, held to the page that actually shipped: a 405
      # rendered beside the word OK, under a sentence telling the reader their
      # own address had too many transactions. Like the chain gate above, it
      # runs against the live origin, so nothing else in this job would ever
      # exercise it, and a gate that has only ever passed has not been shown
      # to fail.
      - name: The address page gate fires on the page that shipped
        working-directory: scripts/universe/visual-qa
        run: node --test address-page-audit.test.mjs

      # Structural facts of the multichain parity release: navigation not
      # gated back to Bitcoin, the route registry whole, the dashboard
      # requesting real data, cubes carrying heights, chain-native units.
      - name: The parity regressions gate holds
        working-directory: scripts/universe
        run: node --test parity-regressions.test.mjs

      # A fixed port here once measured another job's build: two runners share
      # a host, the second gateway crashed on the taken port behind "&", the
      # probe happily reached the first job's server, and the run died halfway
      # when that other job ended. Each run now serves on its own free port and
      # refuses to continue unless the process answering is the one it started.
      - name: Serve the built frontend
        run: |
          GATEWAY_PORT=$(node -e "const s=require('net').createServer();s.listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")
          echo "GATEWAY_PORT=$GATEWAY_PORT" >> "$GITHUB_ENV"
          UNIVERSE_GATEWAY_PORT=$GATEWAY_PORT           UNIVERSE_GATEWAY_ROOT=frontend/dist/mempool/browser           node scripts/universe/gateway.mjs &
          GATEWAY_PID=$!
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:$GATEWAY_PORT/" && break
            sleep 1
          done
          kill -0 "$GATEWAY_PID"
          curl -fsS "http://127.0.0.1:$GATEWAY_PORT/__gateway/health"

      # The harness fails the run when a page never finishes loading, when a
      # chart panel draws nothing, or when a failure state says nothing about
      # why. Those three states passed every other gate here and shipped.
      #
      # The pass here is the broad one: every route, real data, a phone and a
      # desktop width, which is where overflow, broken images and a page that
      # never finishes show up. It measured 5m50s.
      #
      # The deep pass is the `visual` job below. It is routes multiplied by
      # states multiplied by themes multiplied by widths, it grew to 71 minutes
      # of this job's 100 minute cap, and on develop it reached the cap: run
      # 33320958080 was killed at 1h41 with the deep pass still going, so the
      # required check for the promotion had no verdict at all. The comment
      # that used to sit here said to split it again rather than raise the cap,
      # because a gate that cannot finish protects nothing. That is what the
      # shards are.
      - name: Every route renders and finishes, at a phone and a desktop width
        working-directory: scripts/universe/visual-qa
        run: >-
          node capture.mjs --base=http://127.0.0.1:$GATEWAY_PORT --out=./artifacts-broad
          --states=populated --themes=default --viewports=375,1440

      - name: Forced colours and 200 percent zoom
        working-directory: scripts/universe/visual-qa
        run: node modes-check.mjs --base=http://127.0.0.1:$GATEWAY_PORT

      # The shards take this instead of building their own copy. See the note
      # on the `visual` job below for why that matters.
      - name: Keep the build for the visual shards
        uses: actions/cache/save@v4
        with:
          path: frontend/dist
          key: universe-dist-${{ github.sha }}

      # Kept when there is something to look at, which is when a gate failed.
      #
      # A green deep pass is five hundred screenshots nobody opens, and
      # uploading them on every run filled the Actions artifact quota: run
      # 33330398257 passed every gate in this job and then failed on
      # "Artifact storage quota has been hit. Unable to upload any new
      # artifacts", so a build with nothing wrong with it reported a failure.
      # Usage is recalculated every six to twelve hours, so the way out is to
      # stop producing it rather than to delete faster. Retention is capped at
      # three days by the repository in any case.
      - name: Keep the contrast report and the route screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: universe-visual-qa-broad
          path: scripts/universe/visual-qa/artifacts-broad
          if-no-files-found: ignore
          retention-days: 3

  # The deep visual pass, in three shards.
  #
  # Measured on run 33323262662, 2026-08-30, on universe-linux-ultra-04: seven
  # gated routes across three widths, seven states and the themes they carry
  # took 1h11m in one step. Ten minutes a route. One more route would have put
  # the job past its cap; on develop it already had.
  #
  # The split is by route because the cost is per route, and the shards are
  # sized from that measurement rather than by counting names. Each shard
  # builds its own copy, the way the mobile gate does: it costs one production
  # build and buys a gate that can be read, run and debugged on its own, and
  # that cannot make the job beside it wait.
  #
  #   charts-and-mining          graphs, mining              about 20 minutes
  #   protocols-and-home         protocols, home             about 20 minutes
  #   blocks-and-transactions    blocks, tx, address         about 30 minutes
  #                              plus the chain failure states, 3m27s
  visual:
    name: Visual matrix (${{ matrix.shard }})
    # Waits for the frontend job and takes its build rather than making a
    # fourth one.
    #
    # When these shards each built their own copy, a mempool run started five
    # Angular production builds within ninety seconds, and the fleet runs more
    # than one runner per host. Run 33335430574 is what that looks like: the
    # three jobs that started at 21:48 passed, and every build that started at
    # 21:52 was killed with exit code 137. Out of memory, on a change that
    # touched two script files.
    #
    # Sharing one build costs the shards a twenty minute wait and removes
    # three concurrent builds from every run. The cache is keyed by commit, so
    # a shard can only ever pick up the build made from its own source, and a
    # miss falls back to building rather than failing.
    needs: frontend
    runs-on: [self-hosted, universe-linux-ultra]
    timeout-minutes: 60
    strategy:
      # One shard failing says nothing about the others, and finding out that
      # two route groups are broken in one run beats finding out twice.
      fail-fast: false
      matrix:
        include:
          - shard: charts-and-mining
            routes: graphs,mining
            chainStates: 'no'
          - shard: protocols-and-home
            routes: protocols,home
            chainStates: 'no'
          - shard: blocks-and-transactions
            routes: blocks,tx,address
            chainStates: 'yes'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Take the build the frontend job made
        id: dist
        uses: actions/cache/restore@v4
        with:
          path: frontend/dist
          key: universe-dist-${{ github.sha }}

      # A miss is survivable, not fatal: the shard builds what it needs. It
      # costs the memory this change exists to save, so it should be rare, and
      # it is loud in the log when it happens.
      - name: Build it here if the cache did not have it
        if: steps.dist.outputs.cache-hit != 'true'
        working-directory: frontend
        run: |
          echo "no build cached for ${{ github.sha }}; building one here"
          npm ci
          npm run build:universe

      - name: Install the visual QA harness
        working-directory: scripts/universe/visual-qa
        run: npm ci

      # A fixed port here once measured another job's build: two runners share
      # a host, the second gateway crashed on the taken port behind "&", the
      # probe happily reached the first job's server, and the run died halfway
      # when that other job ended. Each run now serves on its own free port and
      # refuses to continue unless the process answering is the one it started.
      - name: Serve the built frontend
        run: |
          test -d frontend/dist/mempool/browser \
            || { echo "no built frontend to serve"; exit 1; }
          GATEWAY_PORT=$(node -e "const s=require('net').createServer();s.listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")
          echo "GATEWAY_PORT=$GATEWAY_PORT" >> "$GITHUB_ENV"
          UNIVERSE_GATEWAY_PORT=$GATEWAY_PORT UNIVERSE_GATEWAY_ROOT=frontend/dist/mempool/browser node scripts/universe/gateway.mjs &
          GATEWAY_PID=$!
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:$GATEWAY_PORT/" && break
            sleep 1
          done
          kill -0 "$GATEWAY_PID"
          curl -fsS "http://127.0.0.1:$GATEWAY_PORT/__gateway/health"

      # The routes this suite holds to a terminal state, taken through every
      # failure state, every theme and the widths that change the layout, which
      # is where a page that lies about why it is empty shows up.
      - name: The gated routes hold up across themes, widths and every failure state
        working-directory: scripts/universe/visual-qa
        run: >-
          node capture.mjs --base=http://127.0.0.1:$GATEWAY_PORT --out=./artifacts
          --routes=${{ matrix.routes }} --viewports=320,768,1440

      # The chain failure states are scoped to the chain routes, so the pass
      # above never reaches them. Five states: a chain that cannot be reached,
      # one that is behind, one whose node is caught up while its protocol side
      # is not, one that withholds readiness without saying why, and an object
      # that simply is not there. Those five are what the whole status
      # vocabulary exists for, and for a long time nothing measured them.
      #
      # Two themes and two widths rather than three and three, because this is
      # the part of the matrix that catches wording and state, not layout.
      - name: A chain that cannot answer says so, in every failure state
        if: matrix.chainStates == 'yes'
        working-directory: scripts/universe/visual-qa
        run: >-
          node capture.mjs --base=http://127.0.0.1:$GATEWAY_PORT --out=./artifacts-chain-states
          --routes=dogecoin,dogecoin-drc20,dogecoin-dunes,dogecoin-dune,zcash,zcash-block,zcash-zrc20,zcash-zrc20-token
          --states=chain-authority-down,chain-behind,chain-not-ready-protocols,chain-not-ready-unexplained,chain-object-missing
          --themes=default,dark --viewports=375,1440

      # Same reasoning as the broad pass above: this is the artifact that
      # filled the quota, at about fifty megabytes a run.
      - name: Keep the contrast report and the route screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Diagnostic only, and never fatal. The account hit its Actions storage
        # quota and every browser job began reporting failure with "No mobile
        # failures" printed directly above the error. `if: failure()` above
        # keeps a green run from attempting the upload at all; this covers the
        # rest, including anyone who changes that back to `always()`. The gate
        # that decides this job has already run either way, so a store that
        # will not take a screenshot can neither turn a green gate red nor
        # hide a red one. The release artifact upload is deliberately not
        # marked this way, because there the upload is the product.
        continue-on-error: true
        with:
          name: universe-visual-qa-${{ matrix.shard }}
          path: |
            scripts/universe/visual-qa/artifacts
            scripts/universe/visual-qa/artifacts-chain-states
          if-no-files-found: ignore
          retention-days: 3

  # The mobile gate runs beside the visual matrix rather than inside it.
  #
  # The matrix job is already 60 minutes of its 100 minute cap, and 78 percent
  # of that is the deep pass. Adding widths, orientations and device emulation
  # to it is how a gate stops finishing, which is the fault the split between
  # the broad and deep passes exists to prevent. So this is a job of its own on
  # a second runner, and the wall clock of the workflow does not move: it
  # finishes in roughly a fifth of the time the matrix takes, on hardware that
  # would otherwise be idle while the matrix runs.
  #
  # It builds its own copy rather than taking an artifact from the job beside
  # it. That costs one extra production build and buys two things worth more
  # than it: the two gates cannot make each other fail or wait, and this one
  # can be read, run and debugged on its own.
  #
  # Measured at about nine minutes, of which six are the build.
  mobile:
    name: Mobile and adaptive layout
    # Takes the frontend job's build, for the same reason the visual shards do.
    #
    # The comment above says this job builds its own copy so the two gates
    # cannot make each other fail or wait. That was written when a run made two
    # builds. It stopped being free: with the fleet running more than one
    # runner per host, a second concurrent Angular build is enough to have a
    # runner killed mid-step, and run 33342564898 lost this job to exactly that
    # with only one other run in flight.
    #
    # Waiting costs nothing here. The shards already gate on the frontend job,
    # so the run is as long as the longest shard either way, and a run now
    # makes exactly one build.
    needs: frontend
    runs-on: [self-hosted, universe-linux-ultra]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Take the build the frontend job made
        id: dist
        uses: actions/cache/restore@v4
        with:
          path: frontend/dist
          key: universe-dist-${{ github.sha }}

      # Survivable, not fatal, and loud: a miss pays the memory this change
      # exists to save.
      - name: Build it here if the cache did not have it
        if: steps.dist.outputs.cache-hit != 'true'
        working-directory: frontend
        run: |
          echo "no build cached for ${{ github.sha }}; building one here"
          npm ci
          npm run build:universe

      - name: Install the visual QA harness
        working-directory: scripts/universe/visual-qa
        run: npm ci

      # Same reasoning as the matrix job: a fixed port once measured another
      # job's build, so each run takes a free one and refuses to continue
      # unless the process answering is the one it started.
      - name: Serve the built frontend
        run: |
          GATEWAY_PORT=$(node -e "const s=require('net').createServer();s.listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")
          echo "GATEWAY_PORT=$GATEWAY_PORT" >> "$GITHUB_ENV"
          UNIVERSE_GATEWAY_PORT=$GATEWAY_PORT UNIVERSE_GATEWAY_ROOT=frontend/dist/mempool/browser node scripts/universe/gateway.mjs &
          GATEWAY_PID=$!
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:$GATEWAY_PORT/" && break
            sleep 1
          done
          kill -0 "$GATEWAY_PID"
          curl -fsS "http://127.0.0.1:$GATEWAY_PORT/__gateway/health"

      # Every route, with a coarse pointer, a software keyboard, a display
      # cutout and a rotation. Each one is measured at 320, at 390 and in
      # landscape, and the fifteen that are one of each thing the product is
      # made of take the other four windows as well. About two hundred page
      # loads, and every one of them is measured a dozen different ways, which
      # is why this stays cheap: the assertions are free and only the page
      # loads cost anything.
      #
      # It used to walk a chosen fifteen routes. Running the same checks over
      # the rest found thirty-six failures on the first pass, none of them in
      # the shell, so the list was measuring what somebody had thought to list.
      - name: Every window a phone can be, measured with a thumb
        working-directory: scripts/universe/visual-qa
        run: node mobile-check.mjs --base=http://127.0.0.1:$GATEWAY_PORT --out=./artifacts-mobile

      # What the shell costs a phone, and what it makes the page do while it
      # arrives. The gated numbers are the compressed payload, which is a
      # property of the build and identical on any machine, and layout shift,
      # which is a property of the stylesheet. Largest paint is printed and not
      # gated: this runner builds, serves and drives browsers at once, and the
      # same commit measured twelve seconds and twenty on two routes whose
      # shells are identical, so it would fail honest changes and pass slow
      # ones depending on what else was running.
      - name: What the shell costs on a phone
        working-directory: scripts/universe/visual-qa
        run: >-
          node mobile-perf.mjs --base=http://127.0.0.1:$GATEWAY_PORT
          --out=./artifacts-perf

      # Kept on failure only, for the reason in the frontend job above: the
      # Actions artifact quota is full, and an upload attempt fails the step.
      # Run 33333310466 passed every measurement in this job and then failed
      # on this upload, which is a green gate reporting red.
      - name: Keep the mobile report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Diagnostic only: an artifact store that will not take a screenshot
        # must not turn a green gate red. See the note in the first such step.
        continue-on-error: true
        with:
          if-no-files-found: ignore
          name: universe-mobile-qa
          path: |
            scripts/universe/visual-qa/artifacts-mobile
            scripts/universe/visual-qa/artifacts-perf
          retention-days: 3

  # The two engines the fleet cannot run.
  #
  # WebKit needs a set of system libraries a Chromium-only host has never had,
  # and it does not degrade without them: it refuses to launch and prints the
  # list. Installing them is one apt command, and the fleet's runner user has
  # no passwordless sudo, so `playwright install --with-deps` fails there with
  # "sudo: a password is required". Measured on universe-linux-ultra-03.
  #
  # So this one job runs on a hosted runner, where that command works. It is
  # the exception to using the fleet, and it is here rather than folded into
  # the job above so the exception is visible and so a hosted outage cannot
  # take the Chromium gate down with it.
  #
  # It is worth the exception. WebKit is what Safari and Chrome on iOS are both
  # built on, and dvh, safe-area insets and the pointer media feature are
  # exactly the rules where engines disagree: a Chromium-only run proves
  # nothing about the platform half this work was written for.
  #
  # When the fleet's image gains those libraries, delete this job and put the
  # two steps back in the one above, which is where they belong.
  mobile-engines:
    name: WebKit and Firefox
    # The Windows browser fleet can run both engines without a privileged
    # system package install. The job uses Git Bash so it shares one script
    # with the Linux browser checks.
    runs-on: [self-hosted, Windows, X64, universe-router]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: npm run build:universe

      - name: Install the visual QA harness
        working-directory: scripts/universe/visual-qa
        run: npm ci

      - name: Fetch the engines
        working-directory: scripts/universe/visual-qa
        run: npx playwright install webkit firefox

      - name: Serve the built frontend
        run: |
          GATEWAY_PORT=$(node -e "const s=require('net').createServer();s.listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")
          echo "GATEWAY_PORT=$GATEWAY_PORT" >> "$GITHUB_ENV"
          UNIVERSE_GATEWAY_PORT=$GATEWAY_PORT UNIVERSE_GATEWAY_ROOT=frontend/dist/mempool/browser node scripts/universe/gateway.mjs &
          GATEWAY_PID=$!
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:$GATEWAY_PORT/" && break
            sleep 1
          done
          kill -0 "$GATEWAY_PID"
          curl -fsS "http://127.0.0.1:$GATEWAY_PORT/__gateway/health"

      # The full window set and the full route list, on the engine Safari is
      # built on. This is the closest an automated run gets to an iPhone, so it
      # is the one place worth paying for the whole matrix twice.
      - name: Every window a phone can be, on WebKit
        working-directory: scripts/universe/visual-qa
        run: >-
          node mobile-check.mjs --base=http://127.0.0.1:$GATEWAY_PORT
          --browser=webkit --out=./artifacts-mobile-webkit

      # Firefox cannot be put into mobile emulation, so it reports a fine
      # pointer and the pointer-conditional rules do not apply to it. What it
      # still measures is every window size, the overflow, the fixed layers,
      # the safe areas and the rotation, which is worth having on a third
      # engine. A subset of routes, because this is the smoke check and the two
      # thorough passes are elsewhere.
      - name: A third engine, on the checks that do not need a thumb
        working-directory: scripts/universe/visual-qa
        run: >-
          node mobile-check.mjs --base=http://127.0.0.1:$GATEWAY_PORT
          --browser=firefox --routes=home,tx,address,blocks,docs
          --out=./artifacts-mobile-firefox

      - name: Keep the engine reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Diagnostic only: an artifact store that will not take a screenshot
        # must not turn a green gate red. See the note in the first such step.
        continue-on-error: true
        with:
          if-no-files-found: ignore
          name: universe-mobile-engines
          path: |
            scripts/universe/visual-qa/artifacts-mobile-webkit
            scripts/universe/visual-qa/artifacts-mobile-firefox
          retention-days: 3
