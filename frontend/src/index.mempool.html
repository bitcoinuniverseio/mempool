<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <!-- LOAD BEARING COMMENTS - DO NOT TOUCH! -->
  <!-- TITLE -->
  <title>Universe Explorer</title>
  <!-- END TITLE -->

  <!-- CONFIG -->
  <script src="/resources/config.js"></script>
  <!-- END CONFIG -->
   <!-- CUSTOMIZATION -->
  <script src="/resources/customize.js"></script>
  <!-- END CUSTOMIZATION -->
  <base href="/">

  <!-- META -->
  <meta name="description" content="Universe Explorer shows Bitcoin, Dogecoin, and Zcash activity while it is still forming, and tells you how much of it is proven." />
  <!-- A PNG, not the SVG this used to point at: no social platform renders
       SVG for a preview, so every shared link previewed blank. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Universe Explorer" />
  <meta property="og:url" content="https://explorer.bitcoinuniverse.io" />
  <meta property="og:image" content="/resources/universe/universe-explorer-social.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Universe Explorer, a block and mempool explorer for Bitcoin, Dogecoin, and Zcash" />
  <meta property="og:description" content="Universe Explorer shows Bitcoin, Dogecoin, and Zcash activity while it is still forming, and tells you how much of it is proven." />
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Universe Explorer">
  <meta name="twitter:description" content="Universe Explorer shows Bitcoin, Dogecoin, and Zcash activity while it is still forming, and tells you how much of it is proven." />
  <meta name="twitter:image" content="/resources/universe/universe-explorer-social.png">
  <!-- END META -->

  <!-- FAVICONS -->
  <link rel="apple-touch-icon" sizes="180x180" href="/resources/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/resources/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/resources/favicons/favicon-16x16.png">
  <link rel="manifest" href="/resources/favicons/site.webmanifest">
  <link rel="shortcut icon" href="/resources/favicons/favicon.ico">
  <link id="canonical" rel="canonical" href="https://explorer.bitcoinuniverse.io">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="msapplication-TileColor" content="#c40059">
  <meta name="msapplication-config" content="/resources/favicons/browserconfig.xml">
  <meta name="theme-color" content="#f7f4f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0a13" media="(prefers-color-scheme: dark)">
  <!-- END FAVICONS -->

  <!-- viewport-fit=cover puts the page under the notch and the home indicator
       rather than inside a letterbox, which is what makes the header and the
       bottom bar reach the edges of the screen. It is only safe alongside the
       safe-area padding in the stylesheet: without that, cover is how content
       ends up underneath a rounded corner.

       No maximum-scale and no user-scalable=no. Pinch zoom is how a great many
       people read anything at all, and taking it away to stop iOS zooming a
       focused field is fixing the wrong thing; the fields are sized at 16px
       instead, which is what actually stops it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>

<body>
  <app-root></app-root>
</body>

</html>
