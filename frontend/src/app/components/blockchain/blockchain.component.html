<!-- The strip is a draggable pan surface: blocks and the 1px scroll spacer
     extend past the viewport on both sides because dragging is how they are
     reached. The clip gate must not read any of that as content cut off, so
     the whole strip declares itself deliberate rather than each child in
     turn; the spacer, then a mined block, were blamed one after the other. -->
<div class="text-center" class="blockchain-wrapper" data-clip-ok [class.time-ltr]="timeLtr" [class.ltr-transition]="ltrTransitionEnabled" #container>
  <div #positionContainer class="position-container" [ngClass]="network ? network : ''" [style]="positionStyle">
    <span>
      <div class="blocks-wrapper">
        <div class="scroll-spacer" *ngIf="minScrollWidth" [style.left]="minScrollWidth + 'px'"></div>
        <app-mempool-blocks [hidden]="pageIndex > 0" [allBlocks]="scrollableMempool" (widthChange)="onMempoolWidthChange($event)"></app-mempool-blocks>
        <app-blockchain-blocks [hidden]="pageIndex > 0"></app-blockchain-blocks>
        <ng-container *ngFor="let page of pages; trackBy: trackByPageFn">
          <app-blockchain-blocks [static]="true" [offset]="page.offset" [height]="page.height" [count]="blocksPerPage" [loadingTip]="loadingTip" [connected]="connected"></app-blockchain-blocks>
        </ng-container>
      </div>
      <div id="divider" [hidden]="pageIndex > 0">
        <button class="block-display-toggle" (click)="toggleBlockDisplayMode()"
                i18n-title="blockchain.toggle-block-display" title="Switch what the blocks show"
                i18n-aria-label="blockchain.toggle-block-display" aria-label="Switch what the blocks show"><fa-icon [icon]="['fas', 'exchange-alt']" [fixedWidth]="true"></fa-icon></button>
        <button class="time-toggle" (click)="toggleTimeDirection()"
                i18n-title="blockchain.toggle-time-direction" title="Switch the direction time runs in"
                i18n-aria-label="blockchain.toggle-time-direction" aria-label="Switch the direction time runs in"><fa-icon [icon]="['fas', 'exchange-alt']" [fixedWidth]="true"></fa-icon></button>
      </div>
    </span>
  </div>
</div>
