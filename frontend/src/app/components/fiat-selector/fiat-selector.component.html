<div [formGroup]="fiatForm" class="selector-field">
    <label class="sr-only" for="fiat-select" i18n="settings.fiat-currency|Fiat currency">Fiat currency</label>
    <select id="fiat-select" formControlName="fiat" class="custom-select custom-select-sm form-control-secondary form-control mx-auto" (change)="changeFiat()">
        <option *ngFor="let currency of currencies" [value]="currency[1].code">{{ currency[1].code }}</option>
    </select>
</div>
