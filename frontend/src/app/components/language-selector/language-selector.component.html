<div [formGroup]="languageForm" class="selector-field">
    <label class="sr-only" for="language-select" i18n="settings.language|Language">Language</label>
    <select id="language-select" formControlName="language" class="custom-select custom-select-sm form-control-secondary form-control mx-auto" (change)="changeLanguage()">
        <option *ngFor="let lang of languages" [value]="lang.code">{{ lang.name }}</option>
    </select>
</div>
