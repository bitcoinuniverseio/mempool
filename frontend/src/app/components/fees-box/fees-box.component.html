<div class="fee-estimation-wrapper" *ngIf="(isLoading$ | async) === false && (recommendedFees$ | async) as recommendedFees; else loadingFees">
  <div class="fee-scale">
    <div class="fee-scale-track" aria-hidden="true">
      <div class="fee-progress-bar" [style.background]="noPriority"></div>
      <div class="band-separator fill"></div>
      <div class="fee-progress-bar priority" [style.background]="gradient"></div>
    </div>
    <div class="fee-scale-labels">
      <span class="fee-label" i18n="fees-box.no-priority" i18n-ngbTooltip="Transaction feerate tooltip (economy)" ngbTooltip="Either 2x the minimum, or the Low Priority rate (whichever is lower)" placement="top">No Priority</span>
      <span class="band-separator"></span>
      <span class="fee-label prority" i18n="fees-box.low-priority" i18n-ngbTooltip="Transaction feerate tooltip (low priority)" ngbTooltip="Usually places your transaction in between the second and third mempool blocks" placement="top">Low Priority</span>
      <span class="fee-label prority" i18n="fees-box.medium-priority" i18n-ngbTooltip="Transaction feerate tooltip (medium priority)" ngbTooltip="Usually places your transaction in between the first and second mempool blocks" placement="top">Medium Priority</span>
      <span class="fee-label prority" i18n="fees-box.high-priority" i18n-ngbTooltip="Transaction feerate tooltip (high priority)" ngbTooltip="Places your transaction in the first mempool block" placement="top">High Priority</span>
    </div>
  </div>

  <div class="fee-estimation-container">
    <div class="item">
      <div class="card-text">
        <div class="fee-text"><app-fee-rate [fee]="recommendedFees.economyFee" [dp]="1"></app-fee-rate></div> <span class="fiat"><app-fiat i18n-ngbTooltip="Transaction fee tooltip" ngbTooltip="Based on average native segwit transaction of 140 vBytes" placement="bottom" [value]="recommendedFees.economyFee * 140" ></app-fiat></span>
      </div>
    </div>
    <div class="band-separator"></div>
    <div class="item">
      <div class="card-text">
        <div class="fee-text"><app-fee-rate [fee]="recommendedFees.hourFee" [dp]="1"></app-fee-rate></div> <span class="fiat"><app-fiat i18n-ngbTooltip="Transaction fee tooltip" ngbTooltip="Based on average native segwit transaction of 140 vBytes" placement="bottom" [value]="recommendedFees.hourFee * 140" ></app-fiat></span>
      </div>
    </div>
    <div class="item">
      <div class="card-text">
        <div class="fee-text"><app-fee-rate [fee]="recommendedFees.halfHourFee" [dp]="1"></app-fee-rate></div> <span class="fiat"><app-fiat i18n-ngbTooltip="Transaction fee tooltip" ngbTooltip="Based on average native segwit transaction of 140 vBytes" placement="bottom" [value]="recommendedFees.halfHourFee * 140" ></app-fiat></span>
      </div>
    </div>
    <div class="item">
      <div class="card-text">
        <div class="fee-text"><app-fee-rate [fee]="recommendedFees.fastestFee" [dp]="1"></app-fee-rate></div> <span class="fiat"><app-fiat i18n-ngbTooltip="Transaction fee tooltip" ngbTooltip="Based on average native segwit transaction of 140 vBytes" placement="bottom" [value]="recommendedFees.fastestFee * 140" ></app-fiat></span>
      </div>
    </div>
  </div>
</div>

<ng-template #loadingFees>
  <div class="fee-scale">
    <div class="fee-scale-track" aria-hidden="true">
      <div class="fee-progress-bar" [style.background]="noPriority"></div>
      <div class="band-separator fill"></div>
      <div class="fee-progress-bar priority" [style.background]="gradient"></div>
    </div>
    <div class="fee-scale-labels">
      <span class="fee-label" i18n="fees-box.no-priority">No Priority</span>
      <span class="band-separator"></span>
      <span class="fee-label prority" i18n="fees-box.low-priority">Low Priority</span>
      <span class="fee-label prority" i18n="fees-box.medium-priority">Medium Priority</span>
      <span class="fee-label prority" i18n="fees-box.high-priority">High Priority</span>
    </div>
  </div>
  <!-- These numbers only ever arrive over the socket, and the socket does not
       fail: when the backend is down it connects and then says nothing. Once
       the feed has given up, placeholders that keep pulsing are promising an
       answer that is not coming. -->
  @if ((liveFeed$ | async)?.status === 'error') {
    <p class="feed-unavailable" i18n="fees-box.feed-unavailable">No live fee estimates: the chain feed is not answering.</p>
  } @else {
    <div class="fee-estimation-container loading-container">
      <div class="item">
        <div class="card-text">
          <div class="skeleton-loader"></div>
          <div class="skeleton-loader"></div>
        </div>
      </div>
      <div class="band-separator"></div>
      <div class="item">
        <div class="card-text">
          <div class="skeleton-loader"></div>
          <div class="skeleton-loader"></div>
        </div>
      </div>
      <div class="item">
        <div class="card-text">
          <div class="skeleton-loader"></div>
          <div class="skeleton-loader"></div>
        </div>
      </div>
      <div class="item">
        <div class="card-text">
          <div class="skeleton-loader"></div>
          <div class="skeleton-loader"></div>
        </div>
      </div>
    </div>
  }
</ng-template>
