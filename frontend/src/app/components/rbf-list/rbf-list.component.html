@if (rbfTrees$ | async; as trees) {
<div class="container-xl" style="min-height: 335px">
  <h1 class="float-left" i18n="page.rbf-replacements">RBF Replacements</h1>
  <div *ngIf="isLoading" class="spinner-border ml-3" role="status"></div>

  <div class="mode-toggle float-right">
    <div class="btn-group" role="group" aria-label="Replacement history filter">
      <button type="button" class="btn btn-primary btn-sm" [class.active]="!fullRbf"
        [attr.aria-pressed]="!fullRbf" fragment="" [routerLink]="[]" i18n="all">All</button>
      <button type="button" class="btn btn-primary btn-sm" [class.active]="fullRbf"
        [attr.aria-pressed]="fullRbf" fragment="fullrbf" [routerLink]="[]" i18n="transaction.full-rbf">Full RBF</button>
    </div>
  </div>

  <div class="clearfix"></div>
  <p class="text-muted">Earlier replacement history may be incomplete.</p>
  @if (loadError) {
    <div role="alert" class="mb-3">
      <p>{{ loadError }}</p>
      <button type="button" class="btn btn-primary" [disabled]="isLoading" (click)="retryLoad()">Retry</button>
    </div>
  }

  <div class="rbf-trees" [ngStyle]="{ 'min-height': '295px', 'opacity': isLoading ? '0.75' : '1' }">
      <div *ngFor="let tree of trees" class="tree">
        <p class="info">
          <span class="type">
            <span *ngIf="tree.mined" class="badge badge-success" i18n="transaction.rbf.mined">Mined</span>
            <span *ngIf="tree.fullRbf" class="badge badge-info" i18n="transaction.full-rbf">Full RBF</span>
          </span>
          <app-time kind="since" [time]="tree.time" [showTooltip]="true"></app-time>
        </p>
        <div class="timeline-wrapper" [class.mined]="tree.mined">
          <app-rbf-timeline [replacements]="tree"></app-rbf-timeline>
        </div>
      </div>

      <div class="no-replacements" *ngIf="!isLoading && !loadError && !trees?.length">
        <p i18n="rbf.no-retained-replacements">No replacements are available in this view.</p>
      </div>
  </div>
  
</div>

}
