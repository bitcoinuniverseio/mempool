<div [formGroup]="themeForm" class="text-small text-center">
    <label class="sr-only" for="theme-select" i18n="settings.theme|Theme">Theme</label>
    <select id="theme-select" formControlName="theme" class="custom-select custom-select-sm form-control-secondary form-control mx-auto" (change)="changeTheme()">
        <option value="default" i18n="settings.theme.light|Light theme">Light</option>
        <option value="dark" i18n="settings.theme.dark|Dark theme">Dark</option>
        <option value="contrast" i18n="settings.theme.contrast|High contrast theme">High contrast</option>
    </select>
</div>
