<div class="chain-sync-notice" role="status" *ngIf="(notice$ | async) as notice">
  <ng-container *ngIf="notice.show">
    <svg class="mark" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <path d="M10 1.6 19 18H1L10 1.6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M10 7.4v4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="10" cy="14.9" r="1.05" fill="currentColor" />
    </svg>
    <div class="body">
      <strong class="title">{{ notice.title }}</strong>
      <p class="detail">{{ notice.detail }}</p>
    </div>
    <button class="status-link" type="button" (click)="health.retry()">Refresh status</button>
  </ng-container>
</div>
