<span [class]="colorClass" *ngIf="blockConversion; else noblockconversion">
  <ng-container *ngIf="blockRate() as rate; else norate">{{ addPlus && value >= 0 ? '+' : '' }}{{ converted(rate) | fiatCurrency : digitsInfo : currency }}</ng-container>
</span>

<ng-template #noblockconversion>
  <span [class]="colorClass">
    <ng-container *ngIf="rateFrom(conversions$ | async) as rate; else norate">{{ addPlus && value >= 0 ? '+' : '' }}{{ converted(rate) | fiatCurrency : digitsInfo : currency }}</ng-container>
  </span>
</ng-template>

<ng-template #norate><span class="fiat-unavailable" role="img" aria-label="Price unavailable" title="Price unavailable" i18n-aria-label="fiat.unavailable" i18n-title="fiat.unavailable">{{ unavailableLabel || '-' }}</span></ng-template>
