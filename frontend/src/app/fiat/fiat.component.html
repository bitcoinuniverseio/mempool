<span [class]="colorClass" *ngIf="blockConversion; else noblockconversion">
  <ng-container *ngIf="blockRate() as rate; else norate">{{ converted(rate) | fiatCurrency : digitsInfo : currency }}</ng-container>
</span>

<ng-template #noblockconversion>
  <span [class]="colorClass">
    <ng-container *ngIf="rateFrom(conversions$ | async) as rate; else norate">{{ converted(rate) | fiatCurrency : digitsInfo : currency }}</ng-container>
  </span>
</ng-template>

<!--
  No price is not a price of zero. With no rate to convert with, the amount is
  left blank rather than rendered as a confident nothing.
-->
<ng-template #norate><span class="fiat-unavailable" title="No price is available in this deployment" i18n-title="fiat.unavailable">&nbsp;</span></ng-template>
