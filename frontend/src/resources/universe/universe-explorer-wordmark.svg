  </g>
  <!-- Wordmark -->
  <text x="250" y="105" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="86" font-weight="700" fill="currentColor" letter-spacing="1">UNIVERSE</text>
  <text x="250" y="190" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="74" font-weight="300" fill="currentColor" letter-spacing="14">EXPLORER</text>
