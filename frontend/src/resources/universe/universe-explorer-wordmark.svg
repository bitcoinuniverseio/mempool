      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#2ad4c8"/>
    </linearGradient>
    <linearGradient id="uew-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb74a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <g transform="translate(20 10) scale(0.39)">
